<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绿色港口等级评价流程｜绿港小贴士</title>
  <style>
    :root { --pine:#164b3b; --mint:#dcefe4; --coral:#e46e4d; --ink:#18332b; }
    * { box-sizing:border-box; }
    body { background:#f5f7f1; color:var(--ink); font-family:"Microsoft YaHei",sans-serif; margin:0; }
    header { background:var(--pine); color:#fff; padding:18px clamp(20px,8vw,100px); }
    header a { color:#dcefe4; text-decoration:none; }
    main { margin:0 auto; max-width:980px; padding:64px 22px 80px; }
    .eyebrow { color:var(--coral); font:12px monospace; letter-spacing:.12em; }
    h1 { font-size:clamp(30px,5vw,56px); line-height:1.15; margin:16px 0; }
    .lead { color:#60766b; max-width:620px; }
    .flow { display:grid; gap:16px; grid-template-columns:repeat(4,1fr); margin-top:50px; }
    .step { background:#fff; border-top:4px solid var(--coral); box-shadow:0 8px 22px rgba(22,75,59,.08); min-height:150px; padding:22px; }
    .step:nth-child(even) { border-top-color:#3e7b3c; transform:translateY(18px); }
    .number { color:var(--coral); font:bold 13px monospace; }.step h2 { font-size:18px; margin:17px 0 8px; }.step p { color:#718078; font-size:12px; margin:0; }
    .back { color:var(--pine); display:inline-block; font-weight:bold; margin-top:50px; text-decoration:none; }
    @media (max-width:700px) { .flow { grid-template-columns:repeat(2,1fr); }.step:nth-child(even) { transform:none; } }
    @media (max-width:430px) { .flow { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><a href="index.html">← 返回绿港小贴士</a></header>
  <main>
    <p class="eyebrow">GREEN PORT EVALUATION / PROCESS</p>
    <h1>绿色港口等级评价流程</h1>
    <p class="lead">从申请受理到后续监督，共 7 个步骤。具体申报要求请以最新政策文件和主管部门通知为准。</p>
    <section class="flow" aria-label="绿色港口等级评价七步流程">
      <article class="step"><span class="number">01</span><h2>申请受理</h2><p>提交评价申请及相关基础材料。</p></article>
      <article class="step"><span class="number">02</span><h2>企业自评</h2><p>依据评价指标完成自查和自评。</p></article>
      <article class="step"><span class="number">03</span><h2>材料审查</h2><p>对申报材料的完整性和合规性进行审查。</p></article>
      <article class="step"><span class="number">04</span><h2>现场评价</h2><p>专家进行现场核查和访谈评价。</p></article>
      <article class="step"><span class="number">05</span><h2>综合确定</h2><p>汇总评价结果并确定绿色港口等级。</p></article>
      <article class="step"><span class="number">06</span><h2>公示授牌</h2><p>评价结果公示后完成授牌。</p></article>
      <article class="step"><span class="number">07</span><h2>后续监督</h2><p>持续跟踪绿色港口建设和运营情况。</p></article>
    </section>
    <a class="back" href="index.html">← 返回便利贴墙</a>
  </main>
</body>
</html>
