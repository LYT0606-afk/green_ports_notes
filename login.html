<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>登录｜绿港小贴士</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <div class="auth-card">
      <section class="auth-brand" aria-label="绿港小贴士">
        <a class="auth-home" href="index.html">← 返回便利贴墙</a>
        <span class="auth-brand-icon" aria-hidden="true">🌿</span>
        <h1>绿港小贴士</h1>
        <p>绿色港口信息便利贴校园服务平台</p>
        <p class="auth-brand-copy">把好知识随手收藏，让每一次好奇都有地方落脚。</p>
      </section>
      <form class="auth-form" id="loginForm">
        <h2>欢迎回来</h2>
        <p class="auth-subtitle">登录后即可收藏便利贴、查看排行榜</p>
        <div class="input-group"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" placeholder="请输入邮箱" required></div>
        <div class="input-group"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" placeholder="请输入密码" required></div>
        <div class="auth-options"><label><input name="remember" type="checkbox"> 记住我</label><button id="forgotPassword" class="auth-text-button" type="button">忘记密码</button></div>
        <p id="authMessage" class="auth-message" role="alert" hidden></p>
        <button class="btn-login" type="submit">登 录</button>
        <p class="auth-switch">还没有账号？<a href="register.html">立即注册</a></p>
        <p class="auth-demo-note">仅用于本地演示：账号保存在当前浏览器，密码仅作 Base64 可逆编码，并非加密。请勿使用真实密码。未勾选“记住我”时只在当前浏览器标签页保持登录。</p>
      </form>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
